<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Process-as-Code — BPMN Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.11.1/dist/assets/diagram-js.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.11.1/dist/assets/bpmn-js.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.11.1/dist/assets/bpmn-font/css/bpmn.css">
  <script src="https://unpkg.com/bpmn-js@17.11.1/dist/bpmn-viewer.development.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="app">

    <!-- ========== SIDEBAR ========== -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">P</div>
        <span class="sidebar-brand-text">Process-as-Code</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-link active" data-view="dashboard">
          <i class="fa-solid fa-chart-line"></i> Dashboard
        </button>
        <button class="nav-link" data-view="bpmn">
          <i class="fa-solid fa-diagram-project"></i> BPMN Visualizer
        </button>
        <button class="nav-link" data-view="roles">
          <i class="fa-solid fa-users"></i> Roles
          <span class="nav-badge" id="badge-roles"></span>
        </button>
        <button class="nav-link" data-view="artifacts">
          <i class="fa-solid fa-file-code"></i> Artifacts
          <span class="nav-badge" id="badge-artifacts"></span>
        </button>
        <button class="nav-link" data-view="glossary">
          <i class="fa-solid fa-book"></i> Glossary
        </button>
      </nav>
      <div class="sidebar-footer">v2.0 &bull; BPMN 2.0</div>
    </aside>

    <!-- ========== MAIN ========== -->
    <main class="main">

      <header class="topbar">
        <h1 class="topbar-title" id="topbar-title">
          <i class="fa-solid fa-chart-line"></i> Dashboard
        </h1>
        <div class="search-wrap">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-input" placeholder="Search roles, artifacts, glossary…" aria-label="Search">
        </div>
      </header>

      <!-- ===== VIEW: Dashboard ===== -->
      <section class="view active" id="view-dashboard">
        <div class="stats-row" id="stats-grid"></div>
        <h2 class="section-heading">Process Catalog</h2>
        <div id="process-cards-grid"></div>
      </section>

      <!-- ===== VIEW: BPMN Visualizer ===== -->
      <section class="view" id="view-bpmn">
        <div class="panel bpmn-panel">
          <div class="bpmn-toolbar">
            <div>
              <h2 class="panel-title" style="margin-bottom:2px;">
                <i class="fa-solid fa-diagram-project"></i> Interactive Process Diagram
              </h2>
              <span class="bpmn-toolbar-hint">Click any task or gateway to see details. Scroll to zoom.</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <select id="process-selector" class="process-select"></select>
              <button class="btn" id="btn-reset-zoom">
                <i class="fa-solid fa-crop-simple"></i> Reset Zoom
              </button>
            </div>
          </div>
          <div class="bpmn-canvas-wrap" id="bpmn-canvas"></div>
        </div>
      </section>

      <!-- ===== VIEW: Roles ===== -->
      <section class="view" id="view-roles">
        <div class="card-grid" id="roles-grid"></div>
      </section>

      <!-- ===== VIEW: Artifacts ===== -->
      <section class="view" id="view-artifacts">
        <div class="card-grid" id="artifacts-grid"></div>
      </section>

      <!-- ===== VIEW: Glossary ===== -->
      <section class="view" id="view-glossary">
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title"><i class="fa-solid fa-book"></i> Process Nomenclature</h2>
          </div>
          <div class="glossary-list" id="glossary-list"></div>
        </div>
      </section>

    </main>
  </div>

  <!-- ========== MODAL ========== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modal-title">Detail</h3>
        <button class="modal-close" id="modal-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
